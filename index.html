<style>
  :root{
    --bg1:#0F2E3B;
    --bg2:#092028;
    --card:#12333F;
    --line:rgba(255,255,255,.08);
    --laranja:#FF8A2B;
    --laranja-2:#FF6A1A;
    --dourado:#FFC64B;
    --texto:#EAF3F5;
    --texto-mute:#9FB8C0;
    --zap:#25D366;
    --zap-2:#1DB955;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    color:var(--texto);
    background:var(--bg2);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .page{
    max-width:480px;margin:0 auto;min-height:100vh;
    display:flex;flex-direction:column;
    background:
      radial-gradient(90% 55% at 50% 0%, #17414F 0%, var(--bg1) 45%, var(--bg2) 100%);
    position:relative;overflow:hidden;
  }
  /* brilho quente atrás da logo */
  .page::before{
    content:"";position:absolute;top:-40px;left:50%;transform:translateX(-50%);
    width:420px;height:420px;border-radius:50%;
    background:radial-gradient(closest-side, rgba(255,150,50,.28), transparent 70%);
    pointer-events:none;
  }

  .hero{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:34px 24px 30px;position:relative;z-index:1;
  }

  .badge{
    display:inline-flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.06);
    border:1px solid var(--line);
    color:var(--texto);
    font-size:12.5px;font-weight:600;letter-spacing:.2px;
    padding:7px 14px;border-radius:100px;margin-bottom:26px;
  }
  .badge .dot{width:7px;height:7px;border-radius:50%;background:var(--zap);box-shadow:0 0 0 0 rgba(37,211,102,.7);animation:pulse 1.9s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.6)}70%{box-shadow:0 0 0 7px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}

    background-size:cover;background-position:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08) inset;
    margin-bottom:24px;
    animation:float 5s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

  h1{
    font-size:clamp(27px,7.4vw,36px);font-weight:800;line-height:1.12;
    letter-spacing:-.6px;margin-bottom:14px;max-width:360px;
  }
  h1 em{font-style:normal;color:var(--dourado)}
  .sub{color:var(--texto-mute);font-size:16px;font-weight:400;line-height:1.5;max-width:330px;margin-bottom:26px}

  .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-bottom:32px}
  .chip{
    display:inline-flex;align-items:center;gap:7px;
    background:var(--card);border:1px solid var(--line);
    color:var(--texto);font-size:13.5px;font-weight:600;
    padding:9px 14px;border-radius:12px;
  }

  .cta{
    display:flex;align-items:center;justify-content:center;gap:11px;
    width:100%;max-width:400px;
    background:linear-gradient(180deg,var(--zap),var(--zap-2));
    color:#fff;font-weight:800;font-size:18px;text-decoration:none;
    padding:19px 22px;border-radius:16px;
    box-shadow:0 10px 26px rgba(37,211,102,.35), 0 6px 0 #159644;
    transition:transform .08s ease, box-shadow .08s ease;
